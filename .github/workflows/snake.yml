# Serpiente sobre el gráfico de contribuciones. Se regenera cada día y deja los
# SVG en la rama "output", que es la que enlaza el README.
name: Snake

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#f5b93a&color_dots=#161b22,#4a3410,#7a5716,#b8862a,#f5b93a
            dist/snake-light.svg?color_snake=#b8862a&color_dots=#ebedf0,#fde9b8,#f9d27a,#eab54a,#c98e1c

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
